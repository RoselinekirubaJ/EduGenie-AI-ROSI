<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduGenie - AI-powered educational learning assistant">
  <title>EduGenie | AI Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">AI-POWERED LEARNING ASSISTANT</p>
      <h1>EduGenie</h1>
      <p>Ask, understand, practice, summarize, and build a learning path.</p>
    </header>

    <section class="card">
      <form id="edugenie-form">
        <label for="task">Choose a learning task</label>
        <select id="task" name="task">
          <option value="qa">Ask a Question</option>
          <option value="explain">Explain a Concept</option>
          <option value="quiz">Generate Quiz</option>
          <option value="summarize">Summarize</option>
          <option value="learn">Recommend Learning Path</option>
        </select>

        <label id="input-label" for="user-input">Question</label>
        <textarea id="user-input" rows="8" placeholder="Type your question here..." required></textarea>

        <div id="level-group" class="hidden">
          <label for="level">Learner level</label>
          <select id="level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>

        <div id="goal-group" class="hidden">
          <label for="goal">Learning goal (optional)</label>
          <input id="goal" type="text" placeholder="e.g. Become job-ready">
        </div>

        <button id="submit-button" type="submit">Generate</button>
      </form>
    </section>

    <section id="status" class="status hidden" aria-live="polite"></section>
    <section id="result" class="card result hidden"></section>

    <footer>
      <span>EduGenie</span>
      <a href="/docs" target="_blank" rel="noopener">API Docs</a>
      <a href="/health" target="_blank" rel="noopener">Health</a>
    </footer>
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
